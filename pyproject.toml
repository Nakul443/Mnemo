[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo"
version = "0.1.0"
description = "Persistent graph memory for AI agents, powered by FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falkordb",
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mnemo = ["prompts/*.md"]
